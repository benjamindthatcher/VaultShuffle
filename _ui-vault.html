<!doctype html><html><head><meta charset="utf-8">

</head><body><div class="appShell"><div class="frame" id="f-vault"><div class="appContent">

<script>window.measure=()=>{const f=document.getElementById("f-vault").getBoundingClientRect(),p=document.getElementById("p-vault").getBoundingClientRect();return {page:"vault",topOffset:+(p.top-f.top).toFixed(1),height:+p.height.toFixed(1),left:+p.left.toFixed(1),width:+p.width.toFixed(1)};};</script>
