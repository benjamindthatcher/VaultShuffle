<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/app/globals.css">
<link rel="stylesheet" href="/app/(product)/shell.module.css">
<link rel="stylesheet" href="/components/shared/StatCard.module.css">
<link rel="stylesheet" href="/app/(product)/collections/collections.module.css">
<style>body{margin:0;background:#050816;color:#f4f7ff;font-family:system-ui}</style>
</head><body><div class="appShell"><div class="frame" id="f-collections"><div class="appContent">
  <section class="collectionsPage">
    <h1 class="visually-hidden">Collections</h1>
    <section class="panel" id="p-collections"><div class="grid">
      <article class="card"><span class="icon">◧</span><div class="content"><p class="label">All Collections</p><strong class="value">1</strong><p class="note">Every shelf currently in rotation.</p></div></article>
      <article class="card"><span class="icon">◧</span><div class="content"><p class="label">Smart Collections</p><strong class="value">1</strong><p class="note">Automatically themed groupings.</p></div></article>
      <article class="card"><span class="icon">◧</span><div class="content"><p class="label">Custom Collections</p><strong class="value">0</strong><p class="note">Hand-shaped shelves with your own intent.</p></div></article>
      <article class="card"><span class="icon">◧</span><div class="content"><p class="label">Games in Collections</p><strong class="value">16</strong><p class="note">Owned games already sorted into groups.</p></div></article>
    </div></section>
    <section class="composerCard"><h2 class="composerTitle">Build your next shelf</h2></section>
  </section>
</div></div>
<script>window.measure=()=>{const f=document.getElementById("f-collections").getBoundingClientRect(),p=document.getElementById("p-collections").getBoundingClientRect();return {page:"collections",topOffset:+(p.top-f.top).toFixed(1),height:+p.height.toFixed(1),left:+p.left.toFixed(1),width:+p.width.toFixed(1)};};</script>
</body></html>
